<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Gull and the City</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><meta name="theme-color" content="#b9d4ed"><meta name="description" content="A cozy, endless seagull arcade game above a hand-painted city."><style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;touch-action:none;font-family:Georgia,serif;background:#b5cef3}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:16px;left:18px;color:#48505d;text-shadow:0 1px 2px #fffe;pointer-events:none}#hud h1{font-size:clamp(17px,2.25vw,30px);margin:0;letter-spacing:.015em;font-weight:700}#score{font-size:38px;font-family:system-ui,sans-serif;font-weight:800;line-height:1.1}#rules{font:11px system-ui,sans-serif;letter-spacing:.06em;font-weight:600}#stats{position:fixed;right:18px;top:20px;text-align:right;font:12px system-ui,sans-serif;color:#4f5662;text-shadow:0 1px 3px white;pointer-events:none}#center{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#485064;text-shadow:0 2px 2px #fffc;pointer-events:none;transition:opacity .65s;width:90%}#center strong{font-size:clamp(30px,5vw,65px);font-weight:400;display:block}#center small{font:12px system-ui,sans-serif;display:block;margin-top:15px;letter-spacing:.12em}#center.hide{opacity:0}#bottom{position:fixed;bottom:22px;width:100%;text-align:center;color:#536373;font:11px system-ui,sans-serif;letter-spacing:.14em;pointer-events:none;text-shadow:0 1px 2px white}button{border:1px solid #7e82947a;background:#fff9eacb;color:#505969;border-radius:30px;padding:9px 14px;cursor:pointer;font:12px system-ui,sans-serif}#sound{position:fixed;right:18px;bottom:15px}#pause{position:fixed;right:130px;bottom:15px}.loading{position:fixed;left:50%;top:65%;transform:translateX(-50%);font:12px system-ui;color:#465}.loading.hide{display:none}@media(max-width:620px){#bottom{display:none}#stats{font-size:10px}#hud h1{font-size:17px}#rules{font-size:9px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><h1>Gull and the City</h1><div id="score">0</div><div id="rules">BALD +5 &nbsp;·&nbsp; PERSON +2 &nbsp;·&nbsp; CAR +1</div></div><div id="stats"><div id="meters">0 m flown</div><div id="hits">0 hits</div></div><div id="center"><strong>Just fly.</strong><small>CLICK · TAP · SPACE TO DROP</small></div><div class="loading" id="loading">Painting the city…</div><div id="bottom">TAKE YOUR TIME · THERE IS NO END</div><button id="pause">Ⅱ Pause</button><button id="sound">♫ Sound off</button>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'), $=id=>document.getElementById(id);
const paths={sky:'backgrounds/sky',skyline:'backgrounds/skyline',buildings:'backgrounds/buildings',street:'backgrounds/street'};
let imgs={},W=innerWidth,H=innerHeight,D=1,time=0,world=0,score=0,hits=0,last=performance.now(),started=false,paused=false,soundOn=false,audio=null;
let people=[],cars=[],drops=[],bursts=[],cloudProps=[];
const random=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const imagePaths=[];
for(const [k,v] of Object.entries(paths))imagePaths.push([k,'assets/'+v+'.png']);
for(let i=0;i<12;i++)imagePaths.push(['gull'+i,'assets/gull/fly_'+String(i).padStart(2,'0')+'.png']);
for(const n of ['bald','grandma','woman','headphones','tourist','courier','fashion','coffee'])imagePaths.push(['person_'+n,'assets/people/'+n+'.png']);
for(let i=0;i<8;i++)imagePaths.push(['car'+i,'assets/cars/car_'+String(i).padStart(2,'0')+'.png']);
for(const n of ['lamp','bench','tree_green','tree_pink','tree_gold','postbox','bin','hydrangea','plant','sign'])imagePaths.push(['prop_'+n,'assets/props/'+n+'.png']);
for(const n of ['badge','burst','bald_bonus','spark','cloud','water_0','water_1','water_2','water_3','water_4'])imagePaths.push(['fx_'+n,'assets/fx/'+n+'.png']);
Promise.all(imagePaths.map(([name,path])=>new Promise(resolve=>{let im=new Image;im.onload=()=>{imgs[name]=im;resolve()};im.onerror=()=>{console.warn('Missing',path);resolve()};im.src=path}))).then(()=>{$('loading').classList.add('hide');setup();requestAnimationFrame(loop)});
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=true;}
function setup(){resize();people=[];cars=[];for(let i=0;i<Math.max(11,W/100);i++)addPerson(random(0,W+100));for(let i=0;i<Math.max(4,W/250);i++)addCar(random(0,W+200));}
addEventListener('resize',()=>resize());
function floorY(){return H*.745} function roadY(){return H*.94}
function bird(){return {x:W*.285,y:H*.22+Math.sin(time*1.5)*Math.min(12,H*.018)}};
function addPerson(x=W+random(70,220)){let list=['bald','grandma','woman','headphones','tourist','courier','fashion','coffee'];let type=Math.random()<.19?'bald':list[1+Math.floor(random(0,7))];people.push({x,type,speed:random(14,40),phase:random(0,7),hit:false,seed:Math.random()})}
function addCar(x=W+random(80,400)){cars.push({x,type:Math.floor(random(0,8)),speed:random(40,105),hit:false,phase:random(0,7)})}
function play(freq=420,seconds=.12,volume=.018){if(!soundOn||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.7,audio.currentTime+seconds);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.00001,audio.currentTime+seconds);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+seconds)}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫ Sound on':'♫ Sound off';if(soundOn){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();play(640,.1,.01)}};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Resume':'Ⅱ Pause'};
function emit(){if(paused)return;if(!started){started=true;$('center').classList.add('hide')}let b=bird();for(let i=0;i<13;i++){let age=i*.016;drops.push({x:b.x+21,y:b.y+22,vx:135+random(-14,15),vy:35+random(-6,15),r:random(2.5,4.5),age:0,delay:age,trail:[],dead:false})}play(250,.07,.008)}
addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')emit()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();emit()}if(e.code==='KeyP')$('pause').click()});
function drawImage(im,x,y,w,h,flip=false){if(!im)return;ctx.save();if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(im,0,y,w,h)}else ctx.drawImage(im,x,y,w,h);ctx.restore()}
function layerTile(im,speed,y,height){if(!im)return;const width=height*im.width/im.height;const offset=(world*speed)%width;for(let i=-1;i<Math.ceil(W/width)+2;i++){let xx=i*width-offset;drawImage(im,xx,y,width,height,(Math.floor(world*speed/width)+i)%2!==0)}}
function prop(name,x,y,w,h){drawImage(imgs['prop_'+name],x,y-h,w,h)}
function scene(){let fy=floorY();drawImage(imgs.sky,0,0,W,H);layerTile(imgs.skyline,.12,fy-H*.57,H*.40);layerTile(imgs.buildings,.40,fy-H*.49,H*.49);layerTile(imgs.street,1.0,fy-H*.32,H*.54);
// Soft, sparse foreground prop accents, placed deterministically in world coordinates.
let unit=510,offset=(world*1.04)%unit;for(let i=-1;i<W/unit+2;i++){let k=i+Math.floor(world*1.04/unit),px=i*unit-offset;if(k%3===0)prop('lamp',px+60,fy+8,42,H*.24);if(k%4===1)prop('tree_green',px+330,fy+12,100,H*.28);}
}
function drawPedestrians(){let y=floorY()+Math.min(18,H*.025);for(let p of people){let h=clamp(H*.145,66,118),im=imgs['person_'+p.type],w=im?h*(im.width/im.height):h*.55;let bob=Math.abs(Math.sin(time*4+p.phase))*1.4;drawImage(im,p.x-w*.5,y-h-bob,w,h);p._box={left:p.x-w*.36,right:p.x+w*.36,top:y-h+5,bottom:y-8};if(p.hit){ctx.fillStyle='#a6c6cbb5';ctx.beginPath();ctx.ellipse(p.x,y-h*.91,10,4,.14,0,Math.PI*2);ctx.fill()}}}
function drawCars(){let y=roadY();for(let car of cars){let h=clamp(H*.14,65,112),im=imgs['car'+car.type],w=im?h*im.width/im.height:h*1.65;drawImage(im,car.x-w/2,y-h,w,h);car._box={left:car.x-w*.46,right:car.x+w*.46,top:y-h*.85,bottom:y-12};if(car.hit){ctx.fillStyle='#b8d8dd99';ctx.beginPath();ctx.ellipse(car.x,y-h*.84,18,6,0,0,7);ctx.fill()}}}
function drawGull(){let index=Math.floor((time*9)%8),im=imgs['gull'+index],b=bird();let w=clamp(W*.145,100,186),h=im?w*im.height/im.width:w*.6;drawImage(im,b.x-w*.48,b.y-h*.48,w,h)}
function reward(target,points,label){if(target.hit)return;target.hit=true;score+=points;hits++;$('score').textContent=score;$('hits').textContent=hits+' hits';bursts.push({x:target.x,y:target._box.top-15,life:1.25,points,label,kind:points===5?'bald_bonus':points===1?'spark':'burst'});play(points===5?780:points===2?580:440,.13,.012)}
function splashAt(x,y){bursts.push({x,y,life:.5,kind:'water_3',points:0,label:''})}
function drawDrops(dt){for(let d of drops){d.delay-=dt;if(d.delay>0)continue;if(d.dead)continue;
// Ballistic motion in game world: initial horizontal velocity + gravity, measured per second.
// The falling stream keeps the gull's inherited horizontal momentum.
d.vy+=860*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.age+=dt;d.trail.push({x:d.x,y:d.y});if(d.trail.length>6)d.trail.shift();
for(const p of people)if(!d.dead&&!p.hit&&p._box&&d.x>=p._box.left&&d.x<=p._box.right&&d.y>=p._box.top&&d.y<=p._box.bottom){d.dead=true;reward(p,p.type==='bald'?5:2,p.type==='bald'?'BALD BONUS!':'NICE!')}
for(const car of cars)if(!d.dead&&!car.hit&&car._box&&d.x>=car._box.left&&d.x<=car._box.right&&d.y>=car._box.top&&d.y<=car._box.bottom){d.dead=true;reward(car,1,'SPLAT!')}
if(d.y>roadY()){d.dead=true;splashAt(d.x,roadY()-7)}
if(d.dead)continue;ctx.lineCap='round';ctx.lineWidth=d.r*.95;ctx.strokeStyle='#deeff7ed';ctx.beginPath();d.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.fillStyle='#ccecf9';ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*.7,d.r*1.65,0,0,7);ctx.fill();}
drops=drops.filter(d=>!d.dead&&d.age<3)}
function drawBursts(dt){for(let b of bursts){b.life-=dt;b.y-=dt*17;ctx.globalAlpha=clamp(b.life*1.6,0,1);if(b.kind==='water_3'){drawImage(imgs.fx_water_3,b.x-21,b.y-18,42,35)}else{let im=imgs['fx_'+b.kind];if(im)drawImage(im,b.x-37,b.y-29,74,58);ctx.fillStyle='#5e5261';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('+'+b.points,b.x,b.y+4);ctx.font='bold 10px system-ui';ctx.fillText(b.label,b.x,b.y+19)}ctx.globalAlpha=1}bursts=bursts.filter(b=>b.life>0)}
function update(dt){time+=dt;let velocity=clamp(W*.12,66,160);world+=velocity*dt;$('meters').textContent=Math.floor(world/12)+' m flown';for(let p of people)p.x-=(velocity*.98+p.speed)*dt;for(let car of cars)car.x-=(velocity*.98+car.speed)*dt;people=people.filter(p=>p.x>-130);cars=cars.filter(c=>c.x>-240);let npeople=clamp(Math.round(W/110),7,17),ncars=clamp(Math.round(W/280),3,8);while(people.length<npeople)addPerson(W+random(35,190));while(cars.length<ncars)addCar(W+random(90,380))}
function loop(now){let dt=Math.min(.035,(now-last)/1000||.016);last=now;if(!paused)update(dt);ctx.clearRect(0,0,W,H);scene();drawPedestrians();drawCars();if(!paused)drawDrops(dt);else drawDrops(0);drawGull();drawBursts(paused?0:dt);requestAnimationFrame(loop)}
})();
</script></body></html>
